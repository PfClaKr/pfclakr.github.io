{% extends "base.html" %}
{% block content %}
<section class="not-found">
  <p class="big">404</p>
  <h1>{{ t.not_found_title }}</h1>
  <p>{{ t.not_found_body }}</p>
  <p class="homes">
    {%- for h in homes %}
    <a href="{{ h.url }}" hreflang="{{ h.code }}" lang="{{ h.code }}">{{ h.name }}</a>
    {%- endfor %}
  </p>
</section>
{% endblock content %}
