{% extends "base.html" %}
{% block content %}
<article class="page">
  <header class="page-header">
    <p class="prompt" aria-hidden="true"><span class="sig">$</span>cat ./{{ page.canonical | trim_end_matches(pat="/") | split(pat="/") | last }}.md</p>
    <h1>{{ title }}</h1>
  </header>
  <div class="prose">
    {{ content | safe }}
  </div>
</article>
{% endblock content %}
